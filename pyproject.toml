[project]
name = 'frida'
version = '0.0.1'
description = 'FRIDA (FRee-boundary Integro-Differential Axisimmetric) solver'
authors = [{ name = "Matteo Bonotto", email = "m.bonotto@outlook.com" }]

[build-system]
requires = ["poetry-core>=1.0.0,<2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.11"
numpy = "*"
black = "*"
mypy = "*"
matplotlib = "*"
scipy = "*"
gmsh = "*"
pytest = "*"
pyvista = "~0.46.4"
meshio = "~5.3.5"

